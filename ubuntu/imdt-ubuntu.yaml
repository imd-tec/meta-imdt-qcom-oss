{{- $base := or .base "ubuntu-base-26.04.1-base-arm64.tar.gz" -}}
{{- $out := or .out "ubuntu-26.04-desktop-arm64.tar.zst" -}}
# Generic Ubuntu 26.04 desktop rootfs for the IMDT SBCs, from ubuntu-base.
# Board files (kernel, modules, firmware) are added by assemble.sh.
architecture: arm64

actions:
  - action: run
    description: Unpack ubuntu-base
    chroot: false
    command: tar -xzpf "$RECIPEDIR/{{ $base }}" -C "$ROOTDIR"

  - action: overlay
    description: Apt pins
    source: overlays/apt

  - action: run
    description: Install packages
    chroot: true
    script: scripts/packages.sh

  - action: overlay
    description: Board-independent config
    source: overlays/rootfs

  - action: run
    description: Users, services and cleanup
    chroot: true
    script: scripts/setup.sh

  - action: run
    description: Pack the rootfs
    chroot: false
    command: tar --numeric-owner --xattrs --xattrs-include='*' --acls -C "$ROOTDIR" -cf - . | zstd -T0 -10 > "$ARTIFACTDIR/{{ $out }}"
