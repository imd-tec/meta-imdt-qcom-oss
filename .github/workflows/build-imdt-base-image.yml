name: Build IMDT Base Image

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/kas-build.yml
    with:
      kas-config: 'kas/includes/base.yml:kas/includes/imdt.yml:kas/machine/imdt-8550-sbc.yml:kas/images/imdt-image-base.yml'
      machine: 'imdt-8550-sbc'
      artifact-name: 'imdt-image-base'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
