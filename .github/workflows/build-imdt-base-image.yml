name: Build IMDT Base Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The multimedia images (open-source and proprietary) are only built and
  # tested on tag releases. On master pushes and PRs we build/test the minimal
  # image alone, keeping CI fast.
  # This job selects the kas-config and LAVA matrix for the rest of the run.
  setup:
    runs-on: ubuntu-latest
    outputs:
      kas-config: ${{ steps.cfg.outputs.kas-config }}
      images: ${{ steps.cfg.outputs.images }}
      wg-slot-8gb: ${{ steps.cfg.outputs.wg-slot-8gb }}
      wg-slot-12gb: ${{ steps.cfg.outputs.wg-slot-12gb }}
    steps:
      - id: cfg
        run: |
          # wg-slot picks the WG_CONF_<slot> secret the runner uses to reach the
          # lab LAN. It is offset per board because the LAVA jobs are serialised
          # per board-tag, so no two jobs holding the same slot can ever run at
          # once — including across concurrent runs on different branches.
          #
          # The base comes from the WG_SLOT_BASE repo variable rather than being
          # hardcoded, so this file stays identical between the private layer and
          # the public one it syncs to while still using disjoint slots. That
          # matters because concurrency groups are scoped per-repo and cannot
          # serialise the two repos against each other: two live tunnels on one
          # slot overwrite each other's peer endpoint and both die.
          #   WG_SLOT_BASE=10  meta-imdt-qcom-oss-dev (private), slots 10-14
          #   WG_SLOT_BASE=15  meta-imdt-qcom-oss (public),       slots 15-19
          #   slot 20          reserved for wg-ci-firewall's netns test
          # Each repo owns 5 slots; every job that can run in parallel with
          # another needs its own offset, so keep BASE+n within the block.
          WG_SLOT_BASE="${{ vars.WG_SLOT_BASE }}"
          if ! [[ "$WG_SLOT_BASE" =~ ^[0-9]+$ ]]; then
            echo "WG_SLOT_BASE repo variable is unset or not numeric" >&2
            exit 1
          fi
          echo "wg-slot-8gb=$((WG_SLOT_BASE))" >> "$GITHUB_OUTPUT"
          echo "wg-slot-12gb=$((WG_SLOT_BASE+1))" >> "$GITHUB_OUTPUT"
          # The multimedia images (open-source and proprietary) are only built
          # and tested on tag releases. On master pushes and PRs we build/test
          # the minimal image alone, keeping CI fast.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "kas-config=kas/imdt-all.yml" >> "$GITHUB_OUTPUT"
            echo 'images={"image-name":["qcom-minimal-image","qcom-multimedia-image","qcom-multimedia-proprietary-image"]}' >> "$GITHUB_OUTPUT"
          else
            echo "kas-config=kas/imdt-minimal.yml" >> "$GITHUB_OUTPUT"
            echo 'images={"image-name":["qcom-minimal-image"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    # One multiconfig build covers both boards and every image, so the shared
    # package set is built once instead of once per board/image. Each machine
    # is packed and uploaded as its own artifact.
    needs: setup
    # Scoped to this job rather than the whole workflow: cancelling at workflow
    # level took running LAVA jobs down with it, leaving a DUT mid-test. A
    # superseded push now only cancels the build it supersedes.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    uses: imd-tec/kas-gh-ci/.github/workflows/kas-build.yml@master
    with:
      kas-config: ${{ needs.setup.outputs.kas-config }}
      machine: 'imdt-8550-sbc imdt-6490-sbc'
      artifact-name: 'qcom-imdt-images'
      rsync-enabled: true
      # Only the 8550 has LAVA coverage, and both boards emit a BOOTAA64.EFI
      # that would collide at the destination.
      rsync-machine: 'imdt-8550-sbc'
      rsync-host: ${{ vars.LAVA_HOST }}
      rsync-user: pi
      rsync-dest: /home/pi/qcom-oss/
      rsync-pattern: '*.swu BOOTAA64.EFI'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # One job per board so the two DUTs test in parallel, with max-parallel
  # serialising the images on each. Leaving all six matrix entries to the
  # per-DUT concurrency group in lava-tests.yml is what dropped the multimedia
  # runs on tag builds: a concurrency group holds one pending job and cancels
  # any further one.
  #
  # Everything that differs between the two DUTs lives here. The DUT ssh
  # endpoint is a secret (DUT_SSH_HOST_8GB / DUT_SSH_HOST_12GB) resolved inside
  # lava-tests.yml from the board tag. Flags are always explicit: GHA loose
  # equality coerces null and false both to 0, so an absent key can't be
  # defaulted with `!= false` at the call site.
  lava-8gb:
    needs: [setup, build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.images) }}
    uses: ./.github/workflows/lava-tests.yml
    with:
      image-name: ${{ matrix.image-name }}
      board-tag: '8550-8gb'
      mem-min-mb: '4500'
      has-camera: true
      # No SD card inserted in this fixture — flip once a card is fitted.
      has-sdcard: false
      # IW416 enumerates on SDIO but no driver binds with the current image.
      has-wifi: false
      wg-slot: ${{ needs.setup.outputs.wg-slot-8gb }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      pr-number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
    secrets: inherit

  lava-12gb:
    needs: [setup, build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.images) }}
    uses: ./.github/workflows/lava-tests.yml
    with:
      image-name: ${{ matrix.image-name }}
      board-tag: '8550-12gb'
      # 8500 not 9000: this board idles at ~9.2GB available, so 9000 was within
      # noise of a fresh boot's memory usage (false failures).
      mem-min-mb: '8500'
      has-camera: true
      has-sdcard: true
      has-wifi: true
      wg-slot: ${{ needs.setup.outputs.wg-slot-12gb }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      pr-number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
    secrets: inherit

  # Reclaim space on the LAVA server: the build step rsyncs a full rootfs .swu
  # (hundreds of MB, GBs for multimedia) plus BOOTAA64.EFI to /home/pi/qcom-oss
  # for every commit, and swu-deploy only consumes them. Delete this commit's
  # artifacts once ALL board/image LAVA jobs have passed — a single job that
  # needs both board jobs runs after every matrix entry finishes, so it never
  # removes a .swu another board's swu-deploy is still using. Skipped (artifacts
  # kept) if any LAVA job failed or was skipped, so a red run's image stays
  # available for debugging and re-runs.
  cleanup-lava-swu:
    needs: [lava-8gb, lava-12gb]
    if: ${{ needs.lava-8gb.result == 'success' && needs.lava-12gb.result == 'success' }}
    runs-on: imx-runner
    steps:
      - name: Delete this commit's staged .swu and BOOTAA64 on the LAVA server
        run: |
          ssh -o StrictHostKeyChecking=accept-new "pi@${{ vars.LAVA_HOST }}" \
            "rm -f /home/pi/qcom-oss/*-imdt-8550-sbc.rootfs-${{ github.sha }}.swu \
                   /home/pi/qcom-oss/BOOTAA64-${{ github.sha }}.EFI"
