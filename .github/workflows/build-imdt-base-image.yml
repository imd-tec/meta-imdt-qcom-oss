name: Build IMDT Base Image

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    uses: imd-tec/kas-gh-ci/.github/workflows/kas-build.yml@master
    with:
      kas-config: 'kas/default.yml'
      machine: 'imdt-8550-sbc'
      artifact-name: 'imdt-image-base'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
