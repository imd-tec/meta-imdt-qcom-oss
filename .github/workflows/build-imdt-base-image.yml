name: Build IMDT Base Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The multimedia images (open-source and proprietary) are only built and
  # tested on tag releases. On master pushes and PRs we build/test the minimal
  # image alone, keeping CI fast.
  # This job selects the kas-config and LAVA matrix for the rest of the run.
  setup:
    runs-on: ubuntu-latest
    outputs:
      kas-config: ${{ steps.cfg.outputs.kas-config }}
      images: ${{ steps.cfg.outputs.images }}
      wg-slot-8gb-1: ${{ steps.cfg.outputs.wg-slot-8gb-1 }}
      wg-slot-8gb-2: ${{ steps.cfg.outputs.wg-slot-8gb-2 }}
    steps:
      - id: cfg
        run: |
          # wg-slot picks the WG_CONF_<slot> secret the runner uses to reach the
          # lab LAN. It is offset per board because the LAVA jobs are serialised
          # per board-tag, so no two jobs holding the same slot can ever run at
          # once — including across concurrent runs on different branches.
          #
          # The base comes from the WG_SLOT_BASE repo variable rather than being
          # hardcoded, so this file stays identical between the private layer and
          # the public one it syncs to while still using disjoint slots. That
          # matters because concurrency groups are scoped per-repo and cannot
          # serialise the two repos against each other: two live tunnels on one
          # slot overwrite each other's peer endpoint and both die.
          #   WG_SLOT_BASE=10  meta-imdt-qcom-oss-dev (private), slots 10-14
          #   WG_SLOT_BASE=15  meta-imdt-qcom-oss (public),       slots 15-19
          #   slot 20          reserved for wg-ci-firewall's netns test
          # Each repo owns 5 slots; every job that can run in parallel with
          # another needs its own offset, so keep BASE+n within the block.
          WG_SLOT_BASE="${{ vars.WG_SLOT_BASE }}"
          if ! [[ "$WG_SLOT_BASE" =~ ^[0-9]+$ ]]; then
            echo "WG_SLOT_BASE repo variable is unset or not numeric" >&2
            exit 1
          fi
          echo "wg-slot-8gb-1=$((WG_SLOT_BASE))" >> "$GITHUB_OUTPUT"
          echo "wg-slot-8gb-2=$((WG_SLOT_BASE+1))" >> "$GITHUB_OUTPUT"
          # The multimedia images (open-source and proprietary) are only built
          # and tested on tag releases. On master pushes and PRs we build/test
          # the minimal image alone, keeping CI fast.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "kas-config=kas/imdt-all.yml" >> "$GITHUB_OUTPUT"
            echo 'images={"image-name":["qcom-minimal-image","qcom-multimedia-image","qcom-multimedia-proprietary-image"]}' >> "$GITHUB_OUTPUT"
          else
            echo "kas-config=kas/imdt-minimal.yml" >> "$GITHUB_OUTPUT"
            echo 'images={"image-name":["qcom-minimal-image"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    # One multiconfig build covers both boards and every image, so the shared
    # package set is built once instead of once per board/image. Each machine
    # is packed and uploaded as its own artifact.
    needs: setup
    # Scoped to this job rather than the whole workflow: cancelling at workflow
    # level took running LAVA jobs down with it, leaving a DUT mid-test. A
    # superseded push now only cancels the build it supersedes.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    uses: imd-tec/kas-gh-ci/.github/workflows/kas-build.yml@master
    with:
      kas-config: ${{ needs.setup.outputs.kas-config }}
      machine: 'imdt-8550-sbc imdt-6490-sbc'
      artifact-name: 'qcom-imdt-images'
      # Nothing in this repo downloads the per-machine tarballs: LAVA gets the
      # OSTree commit archive by rsync below. Skipping the zstd pack + upload
      # of two multi-GB deploy dirs takes a large chunk off every build.
      upload-artifacts: false
      # Tag releases publish one self-contained flash tarball per image (see
      # classes/imdt-qcomflash.bbclass) instead of the whole deploy dir.
      release-files: >-
        qcom-minimal-image-*.rootfs.qcomflash.tar.gz
        qcom-multimedia-image-*.rootfs.qcomflash.tar.gz
        qcom-multimedia-proprietary-image-*.rootfs.qcomflash.tar.gz
      # ostree_repo is the shared archive repo bitbake commits every image into,
      # and each image's .ostreecommit.tar.xz is itself a tar of that same repo
      # (meta-updater sets TAR_IMAGE_ROOTFS:task-image-ostreecommit =
      # ${OSTREE_REPO}). Shipping the directory as well added ~1.7 GB of
      # duplicate objects to the 8550 release asset for nothing.
      pack-exclude: 'ostree_repo'
      # Board files and boot bundle for the ubuntu-image job
      artifact-files: >-
        qcom-minimal-image-*.rootfs.ubuntu-bsp.tar.zst
        qcom-minimal-image-*.rootfs.qcomflash-boot.tar.gz
      rsync-enabled: true
      # Only the 8550 has LAVA coverage. Stage the self-contained per-image
      # OSTree commit archive, ostree-deploy pulls the new commit from it. The
      # systemd-boot UKI/BLS entries are written by ostree admin deploy on the
      # DUT. The FIT holding the DTBs lives on the dtb partition, outside the
      # ostree rootfs, so stage it too and ostree-deploy installs it.
      rsync-machine: 'imdt-8550-sbc'
      rsync-host: ${{ vars.LAVA_HOST }}
      rsync-user: ${{ vars.LAVA_USER }}
      rsync-dest: ${{ vars.LAVA_IMAGES_DIR }}/
      rsync-pattern: '*.ostreecommit.tar.xz qclinuxfitImage'
      clean-checkout: false
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Generic Ubuntu desktop rootfs (ubuntu/), built while the Yocto build runs.
  # Cached for a week so most runs only restore it.
  ubuntu-rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@v4
        with:
          path: out/ubuntu-26.04-desktop-arm64.tar.zst
          key: ubuntu-rootfs-${{ steps.week.outputs.week }}-${{ hashFiles('ubuntu/build-rootfs.sh', 'ubuntu/imdt-ubuntu.yaml', 'ubuntu/overlays/**', 'ubuntu/scripts/**') }}

      - name: Build the rootfs with debos
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./ubuntu/build-rootfs.sh out

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-rootfs-${{ github.sha }}
          path: out/ubuntu-26.04-desktop-arm64.tar.zst
          compression-level: 0
          retention-days: 2

  # Ubuntu flash bundle per board: the rootfs above plus the Yocto kernel,
  # firmware and boot bundle. Attached to the release on tag builds.
  ubuntu-image:
    needs: [build, ubuntu-rootfs]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine: [imdt-8550-sbc, imdt-6490-sbc]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dosfstools e2fsprogs kmod mtools zstd

      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-rootfs-${{ github.sha }}
          path: in

      - uses: actions/download-artifact@v4
        with:
          name: qcom-imdt-images-files-${{ github.sha }}
          path: in

      - name: Assemble
        env:
          M: ${{ matrix.machine }}
        run: |
          sudo WORKDIR="$RUNNER_TEMP" ./ubuntu/assemble.sh "$M" \
            in/ubuntu-26.04-desktop-arm64.tar.zst \
            "in/$M/qcom-minimal-image-$M.rootfs.ubuntu-bsp.tar.zst" \
            "in/$M/qcom-minimal-image-$M.rootfs.qcomflash-boot.tar.gz" \
            out
          rm -f in/ubuntu-26.04-desktop-arm64.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-desktop-${{ matrix.machine }}-${{ github.sha }}
          path: out/ubuntu-desktop-${{ matrix.machine }}.qcomflash.tar.zst
          compression-level: 0
          retention-days: 7

      # The build job has published the release by now. Same 1900 MiB split as kas-gh-ci.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          M: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          F="out/ubuntu-desktop-$M.qcomflash.tar.zst"
          if [ "$(stat -c%s "$F")" -ge $((1900 * 1024 * 1024)) ]; then
            (cd out && sha256sum "$(basename "$F")" > "$(basename "$F").sha256")
            split --bytes=1900M --numeric-suffixes --suffix-length=2 "$F" "$F.part"
            rm "$F"
          fi
          gh release upload "$GITHUB_REF_NAME" out/ubuntu-desktop-"$M".* --clobber
          # The board files, so product rootfs builds can run assemble.sh
          gh release upload "$GITHUB_REF_NAME" \
            "in/$M/qcom-minimal-image-$M.rootfs.ubuntu-bsp.tar.zst" \
            "in/$M/qcom-minimal-image-$M.rootfs.qcomflash-boot.tar.gz" --clobber

  # The generic rootfs on the release, as the base of product rootfs recipes
  ubuntu-rootfs-release:
    needs: [build, ubuntu-rootfs]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-rootfs-${{ github.sha }}
          path: out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/ubuntu-26.04-desktop-arm64.tar.zst --clobber -R "$GITHUB_REPOSITORY"

  # One job per board so the two DUTs test in parallel, with max-parallel
  # serialising the images on each. Leaving all six matrix entries to the
  # per-DUT concurrency group in lava-tests.yml is what dropped the multimedia
  # runs on tag builds: a concurrency group holds one pending job and cancels
  # any further one.
  #
  # Everything that differs between the two DUTs lives here. The DUT ssh
  # endpoint is a secret (DUT_SSH_HOST_8GB_1 / DUT_SSH_HOST_8GB_2) resolved inside
  # lava-tests.yml from the board tag. Flags are always explicit: GHA loose
  # equality coerces null and false both to 0, so an absent key can't be
  # defaulted with `!= false` at the call site.
  # 8550-8gb-1 is pi-tester-3's board, with the AR1335 on CSI0.
  lava-8gb-1:
    needs: [setup, build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.images) }}
    uses: ./.github/workflows/lava-tests.yml
    with:
      image-name: ${{ matrix.image-name }}
      board-tag: '8550-8gb-1'
      mem-min-mb: '4500'
      has-camera: true
      # No SD card inserted in this fixture — flip once a card is fitted.
      has-sdcard: false
      # IW416 enumerates on SDIO but no driver binds with the current image.
      has-wifi: false
      wg-slot: ${{ needs.setup.outputs.wg-slot-8gb-1 }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      pr-number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
      expected-version: ${{ needs.build.outputs.version }}
    secrets: inherit

  # 8550-8gb-2 is pi-tester-9's board. It has no camera on CSI0.
  lava-8gb-2:
    needs: [setup, build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.images) }}
    uses: ./.github/workflows/lava-tests.yml
    with:
      image-name: ${{ matrix.image-name }}
      board-tag: '8550-8gb-2'
      mem-min-mb: '4500'
      has-camera: false
      has-sdcard: false
      # IW416 enumerates on SDIO but no driver binds with the current image.
      has-wifi: false
      wg-slot: ${{ needs.setup.outputs.wg-slot-8gb-2 }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      pr-number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
      expected-version: ${{ needs.build.outputs.version }}
    secrets: inherit

  # Reclaim space on the LAVA server: the build step rsyncs a per-image OSTree
  # commit archive (hundreds of MB, ~1-2 GB for multimedia) to the LAVA images dir
  # for every commit, and ostree-deploy only consumes them. Delete this commit's
  # archives once ALL board/image LAVA jobs have passed — a single job that needs
  # both board jobs runs after every matrix entry finishes, so it never removes
  # an archive another board's ostree-deploy is still using. Skipped (archives
  # kept) if any LAVA job failed or was skipped, so a red run's image stays
  # available for debugging and re-runs.
  cleanup-lava-ostree:
    needs: [lava-8gb-1, lava-8gb-2]
    if: ${{ needs.lava-8gb-1.result == 'success' && needs.lava-8gb-2.result == 'success' }}
    runs-on: imx-runner
    steps:
      - name: Delete this commit's staged OSTree archives on the LAVA server
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ vars.LAVA_USER }}@${{ vars.LAVA_HOST }}" \
            "rm -f ${{ vars.LAVA_IMAGES_DIR }}/*-imdt-8550-sbc.rootfs-${{ github.sha }}.ostreecommit.tar.xz ${{ vars.LAVA_IMAGES_DIR }}/qclinuxfitImage-${{ github.sha }}.qclinuxfitImage"
