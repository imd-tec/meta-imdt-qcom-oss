name: Build IMDT Base Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write
  checks: write
  pull-requests: write

# Only one build per ref needs to run on the single self-hosted builder;
# cancel any superseded in-progress run so a new push doesn't queue behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Build every image in a single bitbake invocation. The self-hosted builder
    # runs one job at a time, so a per-image matrix would build sequentially and
    # rebuild the shared package set twice; one combined build shares it.
    uses: imd-tec/kas-gh-ci/.github/workflows/kas-build.yml@master
    with:
      kas-config: 'kas/imdt-8550-all.yml'
      machine: 'imdt-8550-sbc'
      artifact-name: 'qcom-imdt-images'
      rsync-enabled: true
      rsync-host: ${{ vars.LAVA_HOST }}
      rsync-user: pi
      rsync-dest: /home/pi/qcom-oss/
      rsync-pattern: '*.swu BOOTAA64.EFI'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  lava:
    needs: build
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-name: 'qcom-minimal-image'
            multimedia: false
          - image-name: 'qcom-multimedia-image'
            multimedia: true
    uses: ./.github/workflows/lava-tests.yml
    with:
      image-name: ${{ matrix.image-name }}
      run-multimedia-tests: ${{ matrix.multimedia }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      pr-number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
    secrets: inherit
