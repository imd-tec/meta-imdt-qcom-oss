# AR1335
CONFIG_VIDEO_AR1335=m
# Wi-Fi
CONFIG_MWIFIEX=m
CONFIG_MWIFIEX_SDIO=m
# Ethernet
# NET_VENDOR_MICROCHIP gates the whole microchip/Kconfig block that LAN743X
# lives in (`if NET_VENDOR_MICROCHIP ... endif`). It is `default y` upstream,
# but the base defconfig turns it off, and with the gate off a bare
# CONFIG_LAN743X=m is silently discarded — no build warning, just a kernel
# with no lan743x module. That is exactly what happened on the 7.1 -> 7.2-rc3
# rebase: the GbE PHY still enumerated on PCIe (1055:7430) but nothing bound
# to it, caught by the lan743x-driver-bound case in lava/ssh-tests.yaml.
# Keep this line directly above LAN743X so the two are never separated.
CONFIG_NET_VENDOR_MICROCHIP=y
CONFIG_LAN743X=m
# Speed up ADB / RNDIS gadget bring-up: build the USB device-mode stack
# directly into the kernel so the UDC is available at rootfs mount time,
# not after module autoload.
CONFIG_USB_GADGET=y
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_QCOM=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ECM=y
# Panel and backlight
CONFIG_BACKLIGHT_GPIO=m
CONFIG_DRM_PANEL_SIMPLE=m
