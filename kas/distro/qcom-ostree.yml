# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
header:
  version: 14
  includes:
    - repo: meta-qcom
      file: ci/qcom-distro.yml

distro: qcom-distro-sota

repos:
  meta-updater:
    url: https://github.com/uptane/meta-updater.git
    branch: master

  meta-openembedded:
    layers:
      meta-python:
      meta-filesystems:

local_conf_header:
  ostree-cmdline: |
    # A failed boot must reboot (systemd-boot then rolls back via the BLS
    # counter), not enter EDL, so drop download_mode and add a panic timeout.
    KERNEL_CMDLINE_EXTRA:remove = "qcom_scm.download_mode=1"
    KERNEL_CMDLINE_EXTRA:append = " panic=5"
