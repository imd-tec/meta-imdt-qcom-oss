# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
# Copyright IMDT 2026
#
# Every image for both boards in a single build. Used by CI on tag builds.
# For one image on one board, use the per-image configs directly, e.g.
# imdt-8550-minimal.yml / imdt-6490-minimal.yml.
header:
  version: 14
  includes:
    - kas/includes/multiconfig.yml

target:
  - mc:imdt-8550-sbc:qcom-minimal-image
  - mc:imdt-8550-sbc:qcom-minimal-image.swu
  - mc:imdt-8550-sbc:qcom-multimedia-image
  - mc:imdt-8550-sbc:qcom-multimedia-image.swu
  - mc:imdt-8550-sbc:qcom-multimedia-proprietary-image
  - mc:imdt-8550-sbc:qcom-multimedia-proprietary-image.swu
  # No .swu for the 6490: the .swu recipes are COMPATIBLE_MACHINE = "qcs8550"
  # only, until SWUpdate support lands for this board.
  - mc:imdt-6490-sbc:qcom-minimal-image
