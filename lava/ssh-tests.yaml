device_type: ssh
job_name: post-update system tests on imdt-8550-sbc
tags:
- dut-ssh

# The whole suite normally completes in well under a minute; the worst
# legitimate case (60s camera stream + 60s SD-card wait) is ~3 minutes.
# Keep the action timeout tight so a silently-dead ssh transport (board
# wedge / dropped adb forward) fails the job in minutes, not half an hour.
timeouts:
  job:
    minutes: 20
  action:
    minutes: 10
  connection:
    minutes: 5
priority: medium
visibility: public

actions:
- deploy:
    to: ssh
    os: oe
    timeout:
      minutes: 5

- boot:
    method: ssh
    prompts:
    - 'root@'
    timeout:
      minutes: 5

- test:
    timeout:
      minutes: 10
    definitions:
    - from: inline
      name: system-info
      path: inline/system-info.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: system-info
          description: Basic system information (kernel, hwrevision, rootfs slot)
        run:
          steps:
          - lava-test-case kernel-version --shell uname -a
          - lava-test-case hwrevision --shell cat /etc/hwrevision
          - ROOT_SLOT=$(cat /proc/cmdline | tr ' ' '\n' | grep ^root=) || true
          - 'echo "Active rootfs slot: $ROOT_SLOT"'
          - lava-test-case rootfs-slot --shell test -n "$ROOT_SLOT"

    - from: inline
      name: resources
      path: inline/resources.yaml
      parameters:
        # Minimum available memory in MB expected on this board variant
        # (8 GB board ~6 GB visible after carveouts, 12 GB board ~10 GB).
        # Overridden per board by the CI workflow.
        MEM_MIN_MB: '9000'
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: resources
          description: Disk and memory availability checks
        run:
          steps:
          - lava-test-case disk-free --shell df -h /
          - lava-test-case mem-free --shell free -m
          - MEM_TOTAL_MB=$(free -m | awk '/Mem:/ {print $2}')
          - 'echo "Total memory: ${MEM_TOTAL_MB:-<unknown>}MB"'
          - MEM_AVAIL_MB=$(free -m | awk '/Mem:/ {print $7}')
          - 'echo "Available memory: ${MEM_AVAIL_MB:-<unknown>}MB (minimum: ${MEM_MIN_MB}MB)"'
          - if [ -n "$MEM_AVAIL_MB" ] && [ "$MEM_AVAIL_MB" -ge "$MEM_MIN_MB" ]; then lava-test-case mem-avail-min --result pass; else lava-test-case mem-avail-min --result fail; fi

    - from: inline
      name: wifi
      path: inline/wifi.yaml
      parameters:
        # Set to anything other than 'yes' on boards where Wi-Fi is not
        # expected to work; the check then reports a skip instead of failing.
        # Overridden per board by the CI workflow. (8 GB board: IW416 SDIO
        # card enumerates but no driver binds with the current image.)
        WIFI_PRESENT: 'yes'
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: wifi
          description: Wi-Fi interface presence check (mlan0)
        run:
          steps:
          - if [ "$WIFI_PRESENT" != "yes" ]; then echo "Wi-Fi not expected on this board - skipping"; lava-test-case wifi-present --result skip; exit 0; fi
          - WLAN_IF=$(ip link show mlan0 2>/dev/null) || true
          - if [ -n "$WLAN_IF" ]; then lava-test-case wifi-present --result pass; else lava-test-case wifi-present --result fail; fi

    - from: inline
      name: ar1335-stream
      path: inline/ar1335-stream.yaml
      parameters:
        # Set to anything other than 'yes' on boards without the AR1335
        # camera module attached; the suite then reports skips instead of
        # failing. Overridden per board by the CI workflow.
        CAMERA_PRESENT: 'yes'
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: ar1335-stream
          description: Configure the AR1335 CSI0 pipeline and stream frames with v4l2-ctl
        run:
          steps:
          - if [ "$CAMERA_PRESENT" != "yes" ]; then echo "No AR1335 on this board - skipping camera suite"; lava-test-case pipeline-setup --result skip; lava-test-case sensor-enumerated --result skip; lava-test-case video-node --result skip; lava-test-case stream-30-frames --result skip; exit 0; fi
          - SETUP_OUT=$(sh /usr/sbin/qcs8550-csi0-ar1335.sh 2>&1) && SETUP_RC=0 || SETUP_RC=$?
          - 'echo "$SETUP_OUT"'
          - if [ "$SETUP_RC" = "0" ]; then lava-test-case pipeline-setup --result pass; else lava-test-case pipeline-setup --result fail; fi
          - lava-test-case sensor-enumerated --shell sh -c "media-ctl -d /dev/media0 -p | grep -q ar1335"
          - VIDEO_DEV=$(echo "$SETUP_OUT" | grep -o '/dev/video[0-9]*' | head -n1)
          - VIDEO_DEV=${VIDEO_DEV:-/dev/video0}
          - 'echo "Using video device: $VIDEO_DEV"'
          - if [ -n "$VIDEO_DEV" ]; then lava-test-case video-node --result pass; else lava-test-case video-node --result fail; fi
          - lava-test-case stream-30-frames --shell /usr/bin/timeout 60 v4l2-ctl -d "$VIDEO_DEV" --stream-mmap --stream-count=30

    - from: inline
      name: sdcard
      path: inline/sdcard.yaml
      parameters:
        # Set to anything other than 'yes' on test fixtures without an SD
        # card inserted; the check then reports a skip instead of failing.
        # Overridden per board by the CI workflow.
        SDCARD_PRESENT: 'yes'
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: sdcard
          description: SD card presence check (mmcblk0)
        run:
          steps:
          - if [ "$SDCARD_PRESENT" != "yes" ]; then echo "No SD card in this fixture - skipping"; lava-test-case sdcard-present --result skip; exit 0; fi
          # Wait up to 60s for the SD card device node to appear
          - SD_DEV=""; WAITED=0; while [ "$WAITED" -lt 60 ]; do if [ -e /dev/mmcblk0 ]; then SD_DEV=/dev/mmcblk0; break; fi; sleep 2; WAITED=$((WAITED+2)); done
          - echo "SD card wait took ${WAITED}s"
          # On failure, dump the mmc/sdhci kernel log so a genuine
          # enumeration failure can be told apart from a transport problem.
          - if [ -z "$SD_DEV" ]; then dmesg | grep -iE 'mmc|sdhci' | tail -n 20 || true; fi
          - if [ -n "$SD_DEV" ]; then lava-test-case sdcard-present --result pass; else lava-test-case sdcard-present --result fail; fi

    - from: inline
      name: hardware
      path: inline/hardware.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: hardware
          description: Hardware subsystem presence checks (GPU, BT, I2C, RTC, hwrng, IOMMU, CPU freq)
        run:
          steps:
          - lava-test-case gpu-drm-render --shell test -e /dev/dri/renderD128
          - lava-test-case gpu-drm-card --shell test -e /dev/dri/card0
          - lava-test-case bluetooth-present --shell test -e /sys/class/bluetooth/hci0
          - lava-test-case rtc-present --shell test -e /dev/rtc0
          - lava-test-case cpu-freq-scaling --shell test -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
          - I2C_COUNT=$(ls /dev/i2c-* 2>/dev/null | wc -l)
          - if [ "$I2C_COUNT" -ge 1 ]; then lava-test-case i2c-buses --result pass; else lava-test-case i2c-buses --result fail; fi
          - IOMMU_COUNT=$(ls /sys/kernel/iommu_groups/ 2>/dev/null | wc -l)
          - if [ "$IOMMU_COUNT" -ge 1 ]; then lava-test-case iommu-groups --result pass; else lava-test-case iommu-groups --result fail; fi
          - HWRNG_BYTES=$(dd if=/dev/hwrng bs=16 count=1 2>/dev/null | wc -c)
          - if [ "$HWRNG_BYTES" -ge 16 ]; then lava-test-case hwrng-readable --result pass; else lava-test-case hwrng-readable --result fail; fi

    - from: inline
      name: pcie-gbe
      path: inline/pcie-gbe.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: pcie-gbe
          description: PCIe root complex enumeration and default LAN7430 GbE routing
        run:
          steps:
          # PCIe0 feeds the M.2 Key-E slot, PCIe1 the on-board switch.
          - PCIE0_RC=$(lspci -n 2>/dev/null | grep '^0000:00:00' || true)
          - 'echo "PCIe0 root complex: ${PCIE0_RC:-not found}"'
          - if [ -n "$PCIE0_RC" ]; then lava-test-case pcie0-root-complex --result pass; else lava-test-case pcie0-root-complex --result fail; fi
          - PCIE1_RC=$(lspci -n 2>/dev/null | grep '^0001:00:00' || true)
          - 'echo "PCIe1 root complex: ${PCIE1_RC:-not found}"'
          - if [ -n "$PCIE1_RC" ]; then lava-test-case pcie1-root-complex --result pass; else lava-test-case pcie1-root-complex --result fail; fi
          # UEFI applies the FIT's fixed overlays, so CI images take the GbE path.
          - lava-test-case lan7430-present --shell sh -c "lspci -n | grep -q '1055:7430'"
          - LAN743X_BOUND=$(ls /sys/bus/pci/drivers/lan743x/ 2>/dev/null | grep -v 'bind\|unbind\|new_id\|remove_id\|uevent\|module' || true)
          - if [ -n "$LAN743X_BOUND" ]; then lava-test-case lan743x-driver-bound --result pass; else lava-test-case lan743x-driver-bound --result fail; fi

    - from: inline
      name: dsp-ipa
      path: inline/dsp-ipa.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: dsp-ipa
          description: CDSP remoteproc bring-up and IPA driver init checks
        run:
          steps:
          # No ADSP cases: the ADSP does not come up reliably on this hardware
          # and the checks were only ever reporting that, so they are left out
          # until the ADSP side is fixed. The state is still echoed for context.
          - ADSP_RP=$(for r in /sys/class/remoteproc/remoteproc*; do [ "$(cat "$r/name" 2>/dev/null)" = adsp ] && echo "$r" && break; done) || true
          - 'echo "ADSP remoteproc node: ${ADSP_RP:-<not found>} (state: $(cat "$ADSP_RP/state" 2>/dev/null))"'
          - CDSP_RP=$(for r in /sys/class/remoteproc/remoteproc*; do [ "$(cat "$r/name" 2>/dev/null)" = cdsp ] && echo "$r" && break; done) || true
          - 'echo "CDSP remoteproc node: ${CDSP_RP:-<not found>} (fw: $(cat "$CDSP_RP/firmware" 2>/dev/null))"'
          - CDSP_STATE=$(cat "$CDSP_RP/state" 2>/dev/null) || true
          - 'echo "CDSP state: $CDSP_STATE"'
          - if [ "$CDSP_STATE" = "running" ]; then lava-test-case cdsp-running --result pass; else lava-test-case cdsp-running --result fail; fi
          - if dmesg | grep -q "remote processor cdsp is now up"; then lava-test-case cdsp-booted --result pass; else lava-test-case cdsp-booted --result fail; fi
          - IPA_DEV=$(ls -d /sys/bus/platform/drivers/ipa/*.ipa 2>/dev/null | head -n1)
          - 'echo "IPA device bound: ${IPA_DEV:-<not found>}"'
          - if [ -n "$IPA_DEV" ]; then lava-test-case ipa-driver-bound --result pass; else lava-test-case ipa-driver-bound --result fail; fi
          - if dmesg | grep -q "IPA driver setup completed successfully"; then lava-test-case ipa-setup-complete --result pass; else lava-test-case ipa-setup-complete --result fail; fi

    - from: inline
      name: dsp-htp
      path: inline/dsp-htp.yaml
      parameters:
        # How long to keep running inference for. 30s is enough to catch a
        # session that wedges shortly after a successful first inference,
        # without meaningfully lengthening the suite.
        HTP_DURATION_S: '30'
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: dsp-htp
          description: Run MobileNetV2 on the cDSP's HTP (NPU) via onnxruntime-qnn for a sustained period
        run:
          steps:
          # cdsp-htp-test is qcs8550-only (see packagegroup-imdt-bsp-support.bb);
          # skip cleanly on boards/images that don't have it.
          - if ! command -v cdsp-htp-test >/dev/null 2>&1; then echo "cdsp-htp-test not installed on this image - skipping"; lava-test-case htp-sustained-inference --result skip; exit 0; fi
          - MODEL=/usr/share/cdsp-htp-test/mobilenet_v2.onnx
          - HTP_OUT=$(cdsp-htp-test "$MODEL" "$HTP_DURATION_S" 2>&1) && HTP_RC=0 || HTP_RC=$?
          - 'echo "$HTP_OUT"'
          - if [ "$HTP_RC" = 0 ] && echo "$HTP_OUT" | grep -q "RESULT: PASS"; then lava-test-case htp-sustained-inference --result pass; else lava-test-case htp-sustained-inference --result fail; fi

    - from: inline
      name: gpu-dmesg
      path: inline/gpu-dmesg.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: gpu-dmesg
          description: GPU/zap-shader bring-up check via kernel log (no faults or hangs)
        run:
          steps:
          - dmesg | grep -iE 'adreno|gmu|gpu' || true
          - GPU_FAULTS=$(dmesg | grep -iE 'gpu fault|gpu recovery|gpu hang|hangcheck|\*\*\* gpu|adreno.*fail|zap.*fail' || true)
          - if [ -z "$GPU_FAULTS" ]; then lava-test-case gpu-no-faults --result pass; else echo "$GPU_FAULTS"; lava-test-case gpu-no-faults --result fail; fi

    - from: inline
      name: backlight
      path: inline/backlight.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: backlight
          description: Panel backlight brightness set/get via sysfs (kept under 30)
        run:
          steps:
          - BL=/sys/class/backlight/backlight
          - if [ -d "$BL" ]; then lava-test-case backlight-present --result pass; else lava-test-case backlight-present --result fail; fi
          - MAX_BRIGHTNESS=$(cat "$BL/max_brightness" 2>/dev/null) || true
          - 'echo "max_brightness: ${MAX_BRIGHTNESS:-<unknown>}"'
          - ORIG_BRIGHTNESS=$(cat "$BL/brightness" 2>/dev/null) || true
          - 'echo "original brightness: ${ORIG_BRIGHTNESS:-<unknown>}"'
          # Keep the test brightness low (under 30) to limit backlight power draw
          - TEST_BRIGHTNESS=20
          - lava-test-case set-brightness --shell sh -c "echo $TEST_BRIGHTNESS > $BL/brightness"
          - READBACK=$(cat "$BL/brightness" 2>/dev/null) || true
          - 'echo "brightness after write: ${READBACK:-<unknown>} (expected $TEST_BRIGHTNESS)"'
          - if [ "$READBACK" = "$TEST_BRIGHTNESS" ]; then lava-test-case get-brightness --result pass; else lava-test-case get-brightness --result fail; fi
          # Restore the original brightness so we leave the panel as we found it
          - if [ -n "$ORIG_BRIGHTNESS" ]; then echo "$ORIG_BRIGHTNESS" > "$BL/brightness" || true; fi

    - from: inline
      name: remote-desktop
      path: inline/remote-desktop.yaml
      parameters:
        # The port the VNC server listens on, matching the shipped default.
        VNC_PORT: '5900'
        # Time allowed for the service to start before the VNC server answers.
        VNC_WAIT: '15'
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: remote-desktop
          description: Remote desktop serves VNC, independently of weston.service
        run:
          steps:
          # Check whether the remote desktop is installed - it is only on the
          # multimedia images - and skip every case if it is not.
          - if ! systemctl cat remote-desktop >/dev/null 2>&1; then echo "No remote-desktop service on this image - skipping suite"; for c in remote-desktop-enabled remote-desktop-active serves-vnc survives-client gpu-in-use vnc-absent-when-stopped weston-unaffected-by-stop vnc-returns-when-started; do lava-test-case $c --result skip; done; exit 0; fi

          # Define a stand-in for a VNC client: connects to the VNC port, reads
          # the server's 12-byte greeting, sends the same greeting back, then
          # reads how many login methods are offered. Succeeds if the greeting is
          # VNC and at least one method is offered.
          - VNC_CHECK="import socket,sys; s=socket.create_connection(('127.0.0.1',$VNC_PORT),5); b=s.recv(12); s.sendall(b'RFB 003.008\n'); n=s.recv(1); print('banner',b,'auth types',n[0] if n else 0); sys.exit(0 if b.startswith(b'RFB') and n and n[0]>0 else 1)"

          # Check that the service is enabled, so a board with no display
          # attached is reachable without anyone enabling it first.
          - lava-test-case remote-desktop-enabled --shell sh -c "systemctl is-enabled --quiet remote-desktop"
          # Check that the service is running.
          - lava-test-case remote-desktop-active --shell sh -c "systemctl is-active --quiet remote-desktop"

          # Retry the client check once a second until it succeeds or time runs out.
          - VNC_UP=0; W=0; while [ "$W" -lt "$VNC_WAIT" ]; do if python3 -c "$VNC_CHECK" 2>/dev/null; then VNC_UP=1; break; fi; W=$((W+1)); sleep 1; done
          # Log how long the VNC server took to answer.
          - echo "VNC answered after ${W}s (limit ${VNC_WAIT}s)"
          # Verify that a VNC server answers. On failure, repeat the check with
          # errors shown.
          - if [ "$VNC_UP" = 1 ]; then lava-test-case serves-vnc --result pass; else python3 -c "$VNC_CHECK" || true; lava-test-case serves-vnc --result fail; fi
          # Check that the service is still running after a client has connected.
          - lava-test-case survives-client --shell sh -c "systemctl is-active --quiet remote-desktop"
          # Verify that the remote desktop has the GPU render device open, so it
          # is drawn by the GPU and not in software.
          - RD_PID=$(systemctl show remote-desktop -p MainPID --value)
          - lava-test-case gpu-in-use --shell sh -c "ls -l /proc/$RD_PID/fd | grep -q renderD128"

          # Stop the remote desktop and verify that nothing answers on the port,
          # and that the local compositor is unaffected by it stopping.
          - systemctl stop remote-desktop && sleep 3
          - if python3 -c "$VNC_CHECK" 2>/dev/null; then lava-test-case vnc-absent-when-stopped --result fail; else lava-test-case vnc-absent-when-stopped --result pass; fi
          - lava-test-case weston-unaffected-by-stop --shell sh -c "systemctl is-active --quiet weston"

          # Start it again and verify the VNC server comes back.
          - systemctl start remote-desktop
          - VNC_UP=0; W=0; while [ "$W" -lt "$VNC_WAIT" ]; do if python3 -c "$VNC_CHECK" 2>/dev/null; then VNC_UP=1; break; fi; W=$((W+1)); sleep 1; done
          - echo "VNC returned after ${W}s"
          - if [ "$VNC_UP" = 1 ]; then lava-test-case vnc-returns-when-started --result pass; else lava-test-case vnc-returns-when-started --result fail; fi
