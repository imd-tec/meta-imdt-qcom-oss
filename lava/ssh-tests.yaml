device_type: ssh
job_name: post-update system tests on imdt-8550-sbc
tags:
- dut-ssh

timeouts:
  job:
    minutes: 45
  action:
    minutes: 30
  connection:
    minutes: 5
priority: medium
visibility: public

actions:
- deploy:
    to: ssh
    os: oe
    timeout:
      minutes: 5

- boot:
    method: ssh
    prompts:
    - 'root@'
    timeout:
      minutes: 5

- test:
    timeout:
      minutes: 30
    definitions:
    - from: inline
      name: system-info
      path: inline/system-info.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: system-info
          description: Basic system information (kernel, hwrevision, rootfs slot)
        run:
          steps:
          - lava-test-case kernel-version --shell uname -a
          - lava-test-case hwrevision --shell cat /etc/hwrevision
          - ROOT_SLOT=$(cat /proc/cmdline | tr ' ' '\n' | grep ^root=)
          - 'echo "Active rootfs slot: $ROOT_SLOT"'
          - lava-test-case rootfs-slot --shell test -n "$ROOT_SLOT"

    - from: inline
      name: systemd-health
      path: inline/systemd-health.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: systemd-health
          description: systemd state and kernel critical log checks
        run:
          steps:
          - SYS_STATE=$(timeout 120 systemctl is-system-running --wait)
          - 'echo "systemd state: $SYS_STATE"'
          - systemctl --failed --no-pager || true
          - if [ "$SYS_STATE" = "running" ] || [ "$SYS_STATE" = "degraded" ]; then lava-test-case systemd-state --result pass; else lava-test-case systemd-state --result fail; fi
          - DMESG_CRIT=$(dmesg -r | grep -E '^<[0-2]>' || true)
          - 'echo "Kernel err-level messages (informational):"'
          - dmesg -r | grep -E '^<3>' || true
          - if [ -z "$DMESG_CRIT" ]; then lava-test-case dmesg-critical --result pass; else echo "$DMESG_CRIT"; lava-test-case dmesg-critical --result fail; fi

    - from: inline
      name: resources
      path: inline/resources.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: resources
          description: Disk and memory availability checks
        run:
          steps:
          - lava-test-case disk-free --shell df -h /
          - lava-test-case mem-free --shell free -m
          - MEM_TOTAL_MB=$(free -m | awk '/Mem:/ {print $2}')
          - 'echo "Total memory: ${MEM_TOTAL_MB:-<unknown>}MB"'
          - MEM_AVAIL_MB=$(free -m | awk '/Mem:/ {print $7}')
          - 'echo "Available memory: ${MEM_AVAIL_MB:-<unknown>}MB"'
          - if [ -n "$MEM_AVAIL_MB" ] && [ "$MEM_AVAIL_MB" -ge 9000 ]; then lava-test-case mem-avail-9gb --result pass; else lava-test-case mem-avail-9gb --result fail; fi

    - from: inline
      name: wifi
      path: inline/wifi.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: wifi
          description: Wi-Fi interface presence check (mlan0)
        run:
          steps:
          - WLAN_IF=$(ip link show mlan0 2>/dev/null)
          - if [ -n "$WLAN_IF" ]; then lava-test-case wifi-present --result pass; else lava-test-case wifi-present --result fail; fi

    - from: inline
      name: ar1335-stream
      path: inline/ar1335-stream.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: ar1335-stream
          description: Configure the AR1335 CSI0 pipeline and stream frames with v4l2-ctl
        run:
          steps:
          - SETUP_OUT=$(sh /opt/imdt/camss/qcs8550-csi0-ar1335.sh 2>&1); SETUP_RC=$?
          - 'echo "$SETUP_OUT"'
          - if [ "$SETUP_RC" = "0" ]; then lava-test-case pipeline-setup --result pass; else lava-test-case pipeline-setup --result fail; fi
          - lava-test-case sensor-enumerated --shell sh -c "media-ctl -d /dev/media0 -p | grep -q ar1335"
          - VIDEO_DEV=$(echo "$SETUP_OUT" | grep -o '/dev/video[0-9]*' | head -n1)
          - VIDEO_DEV=${VIDEO_DEV:-/dev/video0}
          - 'echo "Using video device: $VIDEO_DEV"'
          - if [ -n "$VIDEO_DEV" ]; then lava-test-case video-node --result pass; else lava-test-case video-node --result fail; fi
          - lava-test-case stream-30-frames --shell /usr/bin/timeout 60 v4l2-ctl -d "$VIDEO_DEV" --stream-mmap --stream-count=30

    - from: inline
      name: sdcard
      path: inline/sdcard.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: sdcard
          description: SD card presence check (mmcblk0)
        run:
          steps:
          - SD_DEV=$(ls /dev/mmcblk0 2>/dev/null)
          - if [ -n "$SD_DEV" ]; then lava-test-case sdcard-present --result pass; else lava-test-case sdcard-present --result fail; fi

    - from: inline
      name: hardware
      path: inline/hardware.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: hardware
          description: Hardware subsystem presence checks (GPU, BT, I2C, RTC, hwrng, IOMMU, CPU freq)
        run:
          steps:
          - lava-test-case gpu-drm-render --shell test -e /dev/dri/renderD128
          - lava-test-case gpu-drm-card --shell test -e /dev/dri/card0
          - lava-test-case bluetooth-present --shell test -e /sys/class/bluetooth/hci0
          - lava-test-case rtc-present --shell test -e /dev/rtc0
          - lava-test-case cpu-freq-scaling --shell test -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
          - I2C_COUNT=$(ls /dev/i2c-* 2>/dev/null | wc -l)
          - if [ "$I2C_COUNT" -ge 1 ]; then lava-test-case i2c-buses --result pass; else lava-test-case i2c-buses --result fail; fi
          - IOMMU_COUNT=$(ls /sys/kernel/iommu_groups/ 2>/dev/null | wc -l)
          - if [ "$IOMMU_COUNT" -ge 1 ]; then lava-test-case iommu-groups --result pass; else lava-test-case iommu-groups --result fail; fi
          - HWRNG_BYTES=$(dd if=/dev/hwrng bs=16 count=1 2>/dev/null | wc -c)
          - if [ "$HWRNG_BYTES" -ge 16 ]; then lava-test-case hwrng-readable --result pass; else lava-test-case hwrng-readable --result fail; fi

    - from: inline
      name: gbe
      path: inline/gbe.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: gbe
          description: LAN7430 GbE PHY presence checks (PCIe enumeration and driver bind)
        run:
          steps:
          - lava-test-case lan7430-present --shell sh -c "lspci -n | grep -q '1055:7430'"
          - LAN743X_BOUND=$(ls /sys/bus/pci/drivers/lan743x/ 2>/dev/null | grep -v 'bind\|unbind\|new_id\|remove_id\|uevent\|module' || true)
          - if [ -n "$LAN743X_BOUND" ]; then lava-test-case lan743x-driver-bound --result pass; else lava-test-case lan743x-driver-bound --result fail; fi

    - from: inline
      name: dsp-ipa
      path: inline/dsp-ipa.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: dsp-ipa
          description: ADSP, CDSP remoteproc bring-up and IPA driver init checks
        run:
          steps:
          - ADSP_RP=$(for r in /sys/class/remoteproc/remoteproc*; do [ "$(cat "$r/name" 2>/dev/null)" = adsp ] && echo "$r" && break; done)
          - 'echo "ADSP remoteproc node: ${ADSP_RP:-<not found>} (fw: $(cat "$ADSP_RP/firmware" 2>/dev/null))"'
          - ADSP_STATE=$(cat "$ADSP_RP/state" 2>/dev/null)
          - 'echo "ADSP state: $ADSP_STATE"'
          - if [ "$ADSP_STATE" = "running" ]; then lava-test-case adsp-running --result pass; else lava-test-case adsp-running --result fail; fi
          - CDSP_RP=$(for r in /sys/class/remoteproc/remoteproc*; do [ "$(cat "$r/name" 2>/dev/null)" = cdsp ] && echo "$r" && break; done)
          - 'echo "CDSP remoteproc node: ${CDSP_RP:-<not found>} (fw: $(cat "$CDSP_RP/firmware" 2>/dev/null))"'
          - CDSP_STATE=$(cat "$CDSP_RP/state" 2>/dev/null)
          - 'echo "CDSP state: $CDSP_STATE"'
          - if [ "$CDSP_STATE" = "running" ]; then lava-test-case cdsp-running --result pass; else lava-test-case cdsp-running --result fail; fi
          - if dmesg | grep -q "remote processor adsp is now up"; then lava-test-case adsp-booted --result pass; else lava-test-case adsp-booted --result fail; fi
          - if dmesg | grep -q "remote processor cdsp is now up"; then lava-test-case cdsp-booted --result pass; else lava-test-case cdsp-booted --result fail; fi
          - IPA_DEV=$(ls -d /sys/bus/platform/drivers/ipa/*.ipa 2>/dev/null | head -n1)
          - 'echo "IPA device bound: ${IPA_DEV:-<not found>}"'
          - if [ -n "$IPA_DEV" ]; then lava-test-case ipa-driver-bound --result pass; else lava-test-case ipa-driver-bound --result fail; fi
          - if dmesg | grep -q "IPA driver setup completed successfully"; then lava-test-case ipa-setup-complete --result pass; else lava-test-case ipa-setup-complete --result fail; fi

    - from: inline
      name: gpu-dmesg
      path: inline/gpu-dmesg.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: gpu-dmesg
          description: GPU/zap-shader bring-up check via kernel log (no faults or hangs)
        run:
          steps:
          - dmesg | grep -iE 'adreno|gmu|gpu' || true
          - GPU_FAULTS=$(dmesg | grep -iE 'gpu fault|gpu recovery|gpu hang|hangcheck|\*\*\* gpu|adreno.*fail|zap.*fail' || true)
          - if [ -z "$GPU_FAULTS" ]; then lava-test-case gpu-no-faults --result pass; else echo "$GPU_FAULTS"; lava-test-case gpu-no-faults --result fail; fi
