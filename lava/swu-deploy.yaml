device_type: docker
job_name: deploy qcom-minimal-image swu to imdt-8550-sbc via adb
tags:
- dut

timeouts:
  job:
    minutes: 30
  action:
    minutes: 20
  connection:
    minutes: 5
priority: medium
visibility: public

actions:
- deploy:
    to: docker
    image:
      name: lava-adb:latest
      local: true
    timeout:
      minutes: 5

- boot:
    method: docker
    command: /bin/bash
    prompts:
    - 'root@lava'
    timeout:
      minutes: 5

- test:
    timeout:
      minutes: 20
    definitions:
    - from: inline
      name: swu-deploy
      path: inline/swu-deploy.yaml
      parameters:
        SWU_FILE: 'qcom-minimal-image.swu-imdt-8550-sbc.rootfs.swu'
        SWU_URL: ''
        UBOOT_FILE: 'BOOTAA64.EFI'
        UBOOT_URL: ''
        UBOOT_TARGET: '/efi/EFI/BOOT/BOOTAA64.EFI'
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: swu-deploy
          description: Push .swu over adb, run swupdate (A/B rootfs) and update the u-boot UEFI binary
        run:
          steps:
          - adb wait-for-device
          - lava-test-case adb-detect --shell adb get-serialno
          - 'echo "Using .swu: ${SWU_URL:-/images/$SWU_FILE}"'
          - if [ -n "$SWU_URL" ]; then lava-test-case fetch-swu --shell curl -fsSL "$SWU_URL" -o /tmp/update.swu; else lava-test-case copy-swu --shell cp "/images/$SWU_FILE" /tmp/update.swu; fi
          - ROOT_BEFORE=$(adb shell cat /proc/cmdline | tr ' ' '\n' | grep ^root=)
          - 'echo "Active rootfs before update: $ROOT_BEFORE"'
          - adb shell mkdir -p /home/swu
          - lava-test-case push-swu --shell adb push /tmp/update.swu /home/swu/update.swu
          - lava-test-case swupdate --shell adb shell "TMPDIR=/home/swu swupdate -i /home/swu/update.swu && echo SWUPDATE_OK"
          - adb shell rm -rf /home/swu
          # ── u-boot (UEFI) update ─────────────────────────────────────────
          # Overwrite the BOOTAA64.EFI the SoC firmware boots from on the EFI
          # System Partition. Takes effect on the reboot below; the board
          # coming back on adb confirms the new u-boot booted successfully.
          - 'echo "Using u-boot: ${UBOOT_URL:-/images/$UBOOT_FILE} -> $UBOOT_TARGET"'
          - if [ -n "$UBOOT_URL" ]; then lava-test-case fetch-uboot --shell curl -fsSL "$UBOOT_URL" -o /tmp/BOOTAA64.EFI; else lava-test-case copy-uboot --shell cp "/images/$UBOOT_FILE" /tmp/BOOTAA64.EFI; fi
          - lava-test-case push-uboot --shell adb push /tmp/BOOTAA64.EFI /home/BOOTAA64.EFI
          - lava-test-case install-uboot --shell adb shell "cp /home/BOOTAA64.EFI '$UBOOT_TARGET' && sync && echo UBOOT_INSTALL_OK"
          - UBOOT_SRC_MD5=$(adb shell md5sum /home/BOOTAA64.EFI | cut -d' ' -f1)
          - UBOOT_DST_MD5=$(adb shell md5sum "$UBOOT_TARGET" | cut -d' ' -f1)
          - 'echo "u-boot md5 src=$UBOOT_SRC_MD5 dst=$UBOOT_DST_MD5"'
          - if [ -n "$UBOOT_SRC_MD5" ] && [ "$UBOOT_SRC_MD5" = "$UBOOT_DST_MD5" ]; then lava-test-case uboot-verify --result pass; else lava-test-case uboot-verify --result fail; fi
          - adb shell rm -f /home/BOOTAA64.EFI
          - lava-test-case reboot --shell adb reboot
          - sleep 5
          - lava-test-case wait-reboot --shell adb wait-for-device
          - sleep 5
          # The board booted under the freshly-written u-boot; confirm the
          # binary persisted unchanged across the reboot.
          - UBOOT_BOOTED_MD5=$(adb shell md5sum "$UBOOT_TARGET" | cut -d' ' -f1)
          - if [ -n "$UBOOT_SRC_MD5" ] && [ "$UBOOT_SRC_MD5" = "$UBOOT_BOOTED_MD5" ]; then lava-test-case uboot-booted --result pass; else lava-test-case uboot-booted --result fail; fi
          - ROOT_AFTER=$(adb shell cat /proc/cmdline | tr ' ' '\n' | grep ^root=)
          - 'echo "Active rootfs after update: $ROOT_AFTER"'
          - if [ "$ROOT_BEFORE" != "$ROOT_AFTER" ]; then lava-test-case slot-switched --result pass; else lava-test-case slot-switched --result fail; fi
          - lava-test-case post-boot-shell --shell adb shell "cat /etc/hwrevision"
