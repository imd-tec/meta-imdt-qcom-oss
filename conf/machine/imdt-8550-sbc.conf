#@TYPE: Machine
#@NAME: IMDT  8550 SBC 
#@DESCRIPTION: Machine configuration for IMDT  8550 SBC

require conf/machine/include/qcom-qcs8550.inc

MACHINE_FEATURES += "efi pci tpm2"
QCOM_DTB_DEFAULT = "qcs8550-imdt-sbc.dtb"
# Default overlays to apply in u-boot
UBOOT_DEFAULT_FDT_OVERLAYS  ?= " \
    qcs8550-imdt-sbc-display.dtbo \
    qcs8550-imdt-sbc-ar1335-csi0.dtbo \
"
# List of overlay files to be built when building linux.
# These need the qcom/ prefix for the kernel build
# to find the device trees.
KERNEL_DEVICETREE_OVERLAYS ?= "${@ ' '.join(['qcom/' + x for x in d.getVar('UBOOT_DEFAULT_FDT_OVERLAYS').split()]) }"
# Device trees to build and populate /boot/
KERNEL_DEVICETREE ?=  " \
    qcom/${QCOM_DTB_DEFAULT} \
    ${KERNEL_DEVICETREE_OVERLAYS} \
"

QCOM_CDT_FILE = "cdt_rb8_core_kit"
QCOM_BOOT_FILES_SUBDIR = "qcs8550"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/qcs8550-hdk/ufs"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-qcs8550-imdt-sbc"

MACHINE_EXTRA_RRECOMMENDS += " \
    firmware-nxp-wifi-nxpiw416-sdio \
    firmware-qcom-sm8550-imdt-sbc \
"
FIT_DTB_COMPATIBLE[qcs8550-imdt-sbc] = "imdt,qcs8550-sbc"
#U-boot Settings
UBOOT_CONFIG = "imdt-8550-sbc"
UBOOT_CONFIG[imdt-8550-sbc] = "qcom_imdt_qcs8550_defconfig"
