#@TYPE: Machine
#@NAME: IMDT  8550 SBC 
#@DESCRIPTION: Machine configuration for IMDT  8550 SBC

require conf/machine/include/qcom-qcs8550.inc

MACHINE_FEATURES += "efi pci tpm2"

# OSTree single rootfs. sota sets root=LABEL=otaroot, so this is only a fallback.
QCOM_BOOTIMG_ROOTFS = "LABEL=otaroot"
# Multi-DTB FIT (dtb.bin) that the UEFI DtPlatformDxe reads to select the board DTB.
QCOM_DTB_DEFAULT = "multi-dtb"
# Base DTB + display + ar1335-csi0 overlays. FIT config in imdt-fit-dtb-compatible.inc.
KERNEL_DEVICETREE ?= " \
    qcom/qcs8550-imdt-sbc.dtb \
    qcom/qcs8550-imdt-sbc-display.dtbo \
    qcom/qcs8550-imdt-sbc-ar1335-csi0.dtbo \
    qcom/qcs8550-imdt-sbc-cypd6125.dtbo \
"

# CDT reports board-id 0x20 + oem-id 1 so UEFI matches imdt,qcs8550-sbc.
# rev5 is the default cdt.bin. The flash alias picks rev3/rev5 per its arg (README).
QCOM_CDT_FILE = "cdt_imdt_8550_sbc_rev5"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-qcs8550"
QCOM_BOOT_FILES_SUBDIR = "qcs8550"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/qcs8550-hdk/ufs"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-qcs8550-imdt-sbc"

# linux-firmware-qcom-vpu ships qcom/vpu/, which holds the Iris VPU firmware
# (sm8550 wants vpu30_p4.mbn, a symlink to the vendor-signed vpu30_p4_s7.mbn).
# It is not in NON-HLOS.bin, so firmware-qcom-sm8550-imdt-sbc cannot supply it.
MACHINE_EXTRA_RRECOMMENDS += " \
    firmware-qcom-sm8550-imdt-sbc \
    linux-firmware-iw416-sdio \
    linux-firmware-qcom-vpu \
"
